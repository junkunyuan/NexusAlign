name: z_image
path: Tongyi-MAI/Z-Image-Turbo
model_dtype: fp32
amp_dtype: bf16
mode: train

fsdp:
  fsdp_strategy: full_shard
  fsdp_cpu_offload: false
  activation_ckpt: true
  text_encoder_offload: true

ref:
  enable: false
  model_path: ""         # empty -> use model.path
  ref_offload: true      # CPUOffload (FSDP managed)

grpo:
  sample_height: 720
  sample_width: 720
  sample_shift: 3
  sample_eta: 0.5
  sample_steps: 9
  timestep_fraction: 0.5

eval:
  ckpt_path: ""
  cfg: 0.0
  height: 720
  width: 720
  num_infer_steps: 9
  eval_batch_size: 4
