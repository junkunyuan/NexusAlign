name: qwen_image
path: Qwen-Image
model_dtype: bf16
amp_dtype: bf16
mode: train

fsdp:
  fsdp_strategy: full_shard
  fsdp_cpu_offload: false
  activation_ckpt: true
  text_encoder_offload: true  # move to GPU only when encoding prompts, saves ~17 GB/GPU

grpo:
  sample_height: 1024
  sample_width: 1024
  sample_shift: 3
  sample_eta: 0.5
  sample_steps: 20
  timestep_fraction: 0.5

eval:
  ckpt_path: ""
  true_cfg_scale: 1.0
  height: 1024
  width: 1024
  num_infer_steps: 50
  eval_batch_size: 4
