name: flux
path: black-forest-labs/FLUX.1-dev
model_dtype: bf16
amp_dtype: bf16
mode: train

fsdp:
  fsdp_strategy: full_shard
  fsdp_cpu_offload: false
  activation_ckpt: true
  text_encoder_offload: false  # move to GPU only when encoding prompts
  use_sharded_weights: false   # load pre-converted FSDP shards instead of from_pretrained
  sharded_weights_dir: ""      # relative to data_and_model_dir, e.g. flux_fsdp_shards_ws4

grpo:
  sample_height: 720
  sample_width: 720
  sample_shift: 3
  sample_eta: 0.5
  sample_cfg: 3.5
  sample_steps: 20
  timestep_fraction: 0.5

eval:
  ckpt_path: ""
  cfg: 3.5
  height: 720
  width: 720
  num_infer_steps: 50
  eval_batch_size: 8
