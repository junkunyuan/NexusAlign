# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
name: refl  # trainer registry key
debug: false  # if True, all ranks print to the console
seed: 42  # base seed; the runtime RNG uses {seed + rank} in train mode
deterministic: true  # if True, use deterministic mode for reproducibility

# --------------------------------------------------------------------------------
# Data configs.
# --------------------------------------------------------------------------------
groups_per_epoch: 48  # prompts sampled per epoch
sample_batch_size: 9  # samples per rank in one sampling and training batch
updates_per_epoch: 1  # optimizer steps per epoch
shuffle: true  # shuffle the training data

# --------------------------------------------------------------------------------
# Training configs.
# --------------------------------------------------------------------------------
epochs: 1000  # training epochs
# A learning rate of 3e-4 and a weight decay of 1e-4 match DiffusionOPSD Table 1 and
# Fig. 7. The 1e-5 and 1e-2 of its config/refl.py train about 10 times slower.
learning_rate: 3.0e-4  # AdamW learning rate
adam_beta1: 0.9  # AdamW beta1
adam_beta2: 0.999  # AdamW beta2
adam_weight_decay: 1.0e-4  # AdamW weight decay
adam_epsilon: 1.0e-8  # AdamW epsilon
max_grad_norm: 1.0  # max gradient norm for clipping

# --------------------------------------------------------------------------------
# EMA configs.
# --------------------------------------------------------------------------------
ema_decay: 0.9  # EMA decay
ema_update_interval: 1  # update EMA every N optimizer steps

# --------------------------------------------------------------------------------
# Logging configs.
# --------------------------------------------------------------------------------
log_every_n_steps: 2  # print and track the metrics every N total steps
log_hardware: true  # if True, track GPU and CPU usage, and GPU efficiency such as MFU
peak_tflops: null  # dense FP16/BF16 TFLOPS of one GPU for MFU; null looks it up by GPU
log_tensorboard: false  # if True, also write scalars to log_dir/tensorboard
plot_every_n_seconds: 30  # redraw the metric figures at most once every N seconds

# --------------------------------------------------------------------------------
# Checkpoint configs.
# --------------------------------------------------------------------------------
save_ckpt_every_n_epochs: 100  # save every N epochs, plus the initial weights at epoch 0
save_ckpt_keep_last_n_epochs: 100  # keep only the last N epoch checkpoints
save_ckpt_every_n_steps: null  # ReFL saves only end-of-epoch checkpoints
save_ckpt_keep_last_n_steps: 10  # keep only the last N step checkpoints
resume_path: null  # for example ${log_dir}/checkpoints/epoch_2-step_10-total_step_50
load_ckpt_only_model: false  # if true, skip the optimizer, lr_scheduler, and scaler
save_ckpt_only_model: false  # if true, skip the optimizer, lr_scheduler, and scaler
