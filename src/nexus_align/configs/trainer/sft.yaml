# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
name: sft  # trainer registry key
debug: false  # if True, all ranks print to the console
seed: 42  # base seed; the runtime RNG uses {seed + rank} in train mode
deterministic: true  # if True, use deterministic mode for reproducibility

# --------------------------------------------------------------------------------
# Data configs.
# --------------------------------------------------------------------------------
train_batch_size: 2048  # total batch size of one optimizer step over all ranks
num_workers: 8  # number of workers for data loading
grad_accu_step: 1  # gradient accumulation steps
shuffle: true  # shuffle the training data
drop_last: true  # drop the last incomplete batch

# --------------------------------------------------------------------------------
# Training configs.
# --------------------------------------------------------------------------------
epochs: 100  # training epochs
optimizer_type: adam  # adam, or muon: Muon for linear weights, Adam for the rest
learning_rate: 2.8e-4  # Adam learning rate
warmup_epochs: 0  # linear LR warmup from 0 over N epochs, then constant; 0 disables it
adam_beta1: 0.9  # Adam beta1
adam_beta2: 0.95  # Adam beta2
adam_weight_decay: 0.0  # Adam weight decay
adam_epsilon: 1.0e-8  # Adam epsilon
max_grad_norm: 1.0  # max gradient norm for clipping

# --------------------------------------------------------------------------------
# EMA configs.
# --------------------------------------------------------------------------------
ema_decay: 0.9999  # EMA decay
ema_halflife_kimg: null  # EDM EMA half-life in kimg; null uses ema_decay

# --------------------------------------------------------------------------------
# Logging configs.
# --------------------------------------------------------------------------------
log_every_n_steps: 100  # print and track the metrics every N total steps
log_hardware: true  # if True, track GPU and CPU usage, and GPU efficiency such as MFU
peak_tflops: null  # dense FP16/BF16 TFLOPS of one GPU for MFU; null looks it up by GPU
log_tensorboard: false  # if True, also write scalars to log_dir/tensorboard
plot_every_n_seconds: 30  # redraw the metric figures at most once every N seconds

# --------------------------------------------------------------------------------
# Checkpoint configs.
# --------------------------------------------------------------------------------
save_ckpt_every_n_epochs: null  # save every N epochs; null disables it
save_ckpt_keep_last_n_epochs: 10  # keep only the last N epoch checkpoints
save_ckpt_every_n_steps: null  # save every N total steps; null disables it
save_ckpt_keep_last_n_steps: 10  # keep only the last N step checkpoints
resume_path: null  # for example ${log_dir}/checkpoints/epoch_2-step_10-total_step_50
load_ckpt_only_model: false  # if true, skip the optimizer, lr_scheduler, and scaler
save_ckpt_only_model: false  # if true, skip the optimizer, lr_scheduler, and scaler
