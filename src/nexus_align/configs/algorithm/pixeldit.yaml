# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
name: pixeldit  # algorithm name

# --------------------------------------------------------------------------------
# Timestep configs.
# t = 0 is the noise and t = 1 is the clean image.
# --------------------------------------------------------------------------------
time_mu: 0.0  # logit_normal mean
time_sigma: 1.0  # logit_normal std
time_shift: 1.0  # shift s of t to t / (t + s (1 - t)); s > 1 adds noise

# --------------------------------------------------------------------------------
# CFG configs.
# --------------------------------------------------------------------------------
cfg_prob: 0.1  # probability to drop the class label for CFG

# --------------------------------------------------------------------------------
# REPA configs.
# --------------------------------------------------------------------------------
repa_weight: 0.5  # weight of the REPA loss
repa_encoder_path: ${data_and_model_dir}/timm/vit_base_patch14_dinov2.lvd142m  # DINOv2 path of the REPA targets

# --------------------------------------------------------------------------------
# Sampling configs.
# --------------------------------------------------------------------------------
sample_time_shift: 1.0  # time shift of the sampling steps

# --------------------------------------------------------------------------------
# Precision configs.
# --------------------------------------------------------------------------------
autocast_dtype: bf16  # model compute dtype
