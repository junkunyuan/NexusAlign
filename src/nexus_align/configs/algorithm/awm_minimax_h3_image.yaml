# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
name: awm_minimax_h3_image  # algorithm name

# --------------------------------------------------------------------------------
# Sampling configs. H3-Image fixes its native sampler: six PDD steps without CFG.
# --------------------------------------------------------------------------------
resolution: 768  # image resolution
num_steps: 6  # rollout sampling steps of the SA-Solver
noise_level: 0.0  # SA-Solver noise tau for t in [0.3, 0.9]; 0 gives the ODE
max_sequence_length: 4096  # Qwen3-VL prompt tokens
autocast_dtype: bf16  # transformer compute dtype; H3 runs without autocast

# --------------------------------------------------------------------------------
# Advantage configs.
# --------------------------------------------------------------------------------
group_size: 24  # images per prompt, G
chunk_size: 4  # members per forward pass, in the rollout and in training
max_groups: 1024  # groups per rank and epoch, for the noise seeds
adv_clip_max: 5.0  # clip the advantages to [-adv_clip_max, adv_clip_max]
advantage_max: 1.0  # then scale them to [-advantage_max, advantage_max]

# --------------------------------------------------------------------------------
# Policy loss configs.
# --------------------------------------------------------------------------------
num_train_timesteps: 6  # Monte Carlo timesteps T of each image; H3 trains every PDD step
timestep_fraction: 1.0  # draw the stratified timesteps from steps 1 to int(num_steps * fraction)
ghuber_power: 0.5  # power p of the generalized Huber log-likelihood; 1 gives w(t) = t of paper Eq. 15

# --------------------------------------------------------------------------------
# KL configs.
# --------------------------------------------------------------------------------
kl_beta: 3.0e-3  # coefficient of the velocity KL to the base model
kl_cfg_scale: 1.0  # CFG scale of the base model in this KL; H3-Image has no CFG
ref_kl_beta: 1.0  # coefficient beta of the velocity KL to the EMA reference; see paper Eq. 16
ref_decay_rate: 0.001  # EMA reference decay = min(ref_decay_rate * step, ref_decay_max)
ref_decay_max: 0.3  # highest decay of the EMA reference
