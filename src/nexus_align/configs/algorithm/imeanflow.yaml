# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
name: imeanflow  # algorithm name

# --------------------------------------------------------------------------------
# Timestep configs.
# --------------------------------------------------------------------------------
time_mu: -0.4  # logit_normal mean
time_sigma: 1.0  # logit_normal std
ratio_r_not_equal_t: 0.5  # fraction of samples with r != t

# --------------------------------------------------------------------------------
# CFG configs.
# --------------------------------------------------------------------------------
cfg_prob: 0.1  # probability to drop the class label for CFG
cfg_omega_max: 8.0  # sample omega from [1, cfg_omega_max]
cfg_beta: 1.0  # omega ~ p(omega) ∝ omega^-beta
cfg_min_t_range: [0.0, 0.5]  # lowest timestep for CFG; t_min ~ U(range)
cfg_max_t_range: [0.5, 1.0]  # highest timestep for CFG; t_max ~ U(range)

# --------------------------------------------------------------------------------
# Loss weighting configs.
# --------------------------------------------------------------------------------
adaptive_p: 1.0  # power p of the adaptive weight
adaptive_eps: 0.01  # constant c added to the loss inside the adaptive weight
