# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
name: meanflow  # algorithm name

# --------------------------------------------------------------------------------
# Timestep configs.
# --------------------------------------------------------------------------------
path_type: linear  # timestep interpolant; "linear" or "cosine"
time_sampler: logit_normal  # timestep sampler; "uniform" or "logit_normal"
time_mu: -0.4  # mean of logit_normal, if time_sampler is logit_normal
time_sigma: 1.0  # std of logit_normal, if time_sampler is logit_normal
ratio_r_not_equal_t: 0.25  # fraction of samples with r != t

# --------------------------------------------------------------------------------
# CFG configs.
# --------------------------------------------------------------------------------
cfg_prob: 0.1  # probability to drop the class label for CFG
cfg_omega: 0.2  # CFG weight of the instantaneous velocity
cfg_kappa: 0.92  # CFG weight of the mean velocity
cfg_min_t: 0.0  # lowest timestep for CFG
cfg_max_t: 0.8  # highest timestep for CFG

# --------------------------------------------------------------------------------
# Loss weighting configs.
# --------------------------------------------------------------------------------
weighting: adaptive  # "uniform" (squared L2) or "adaptive"
adaptive_p: 1.0  # power p of the adaptive weight
adaptive_eps: 0.01  # constant c added to the loss inside the adaptive weight
