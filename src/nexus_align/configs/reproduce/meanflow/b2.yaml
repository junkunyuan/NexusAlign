# @package _global_
# Reproduce MeanFlow-B/2 with the setting in Table 4 of the paper.
# The other args follow configs/default.py and configs/run_b4.yml of the official code.
# Launch with: +reproduce=meanflow/b2
exp_info: meanflow_b2_reproduce  # experiment name

model:
  name: meanflowdit_b_2  # meanflowdit_xl_2, meanflowdit_l_2, meanflowdit_m_2, meanflowdit_b_2

algorithm:
  cfg_omega: 1.0  # CFG weight of the instantaneous velocity
  cfg_kappa: 0.5  # CFG weight of the mean velocity
  cfg_min_t: 0.0  # lowest timestep for CFG
  cfg_max_t: 1.0  # highest timestep for CFG

trainer:
  epochs: 240  # training epochs
  train_batch_size: 256  # total batch size of one optimizer step over all ranks
  learning_rate: 1.0e-4  # Adam learning rate
  ema_decay: 0.9999  # EMA decay
  max_grad_norm: .inf  # max gradient norm for clipping; the paper uses no clipping
  save_ckpt_every_n_epochs: 20  # save every N epochs; null disables it
  save_ckpt_keep_last_n_epochs: 100  # keep only the last N epoch checkpoints
  log_every_n_steps: 200  # print and track the metrics every N total steps
