# @package _global_
# Reproduce pMF-H/16 with the setting in Table 6 of the paper.
# The other args follow the official configs/default.py and configs/pMF_H_16_config.yml
# of the hsdp branch.
# Launch with: +reproduce=pmeanflow/h16
# Evaluate with: CFG_SCALE=7.0 CFG_MIN_T=0.2 CFG_MAX_T=0.6 (official eval_config.yml)
exp_info: pmeanflow_h16_reproduce  # experiment name

# Cache the uint8 center crops, as the official input_pipeline.py makes them.
data:
  vae: null  # VAE model path
  cache_dir: ${data_and_model_dir}/ILSVRC/imagenet-1k/pixels_256  # cache directory

model:
  name: pmeanflowdit_h_16  # pmeanflowdit_{b,l,h}_16; _32 for 512x512 images

algorithm:
  time_mu: 0.0  # logit_normal mean
  # Double the noise std, as paper Appendix A.1 does for the longer training.
  noise_scale: 2.0  # noise std; image_size / 256 in paper Table 8
  uniform_time_prob: 0.1  # probability to sample r and t uniformly
  # The official config sets convnext_max_t: 0.6, which its code does not read.
  # Paper Appendix A.1 gives 0.6 as the threshold of the perceptual losses.
  perceptual_max_t: 0.6  # use the perceptual losses only for t < perceptual_max_t

trainer:
  epochs: 320  # training epochs
  train_batch_size: 1024  # total batch size of one optimizer step over all ranks
  optimizer_type: muon  # adam, or muon: Muon for linear weights, Adam for the rest
  learning_rate: 1.0e-3  # Adam learning rate; Muon uses it too
  # The official eval_config.yml picks this EMA of the three that the run keeps.
  ema_halflife_kimg: 1000  # EDM EMA half-life in kimg; null uses ema_decay
  max_grad_norm: .inf  # max gradient norm for clipping; the official code does not clip
  save_ckpt_every_n_epochs: 32  # save every N epochs; null disables it
  save_ckpt_keep_last_n_epochs: 100  # keep only the last N epoch checkpoints
  log_every_n_steps: 100  # print and track the metrics every N total steps
