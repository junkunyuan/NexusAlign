# @package _global_
# Reproduce DiffusionART on GenEval with SD3.5-M, CFG-free.
# The args follow configs/paper/image/sd3_geneval_art.yaml of the official code.
# The training steps follow Fig. 5 of the paper.
# Launch with: EXP=geneval bash scripts/reproduce/diffusion_art_train.sh
exp_info: diffusion_art_geneval_reproduce  # experiment name

model:
  ema_enabled: false  # if true, use an EMA model; it tracks only the LoRA weights
