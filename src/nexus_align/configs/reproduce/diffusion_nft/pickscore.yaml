# @package _global_
# Reproduce DiffusionNFT on human preference alignment with SD3.5-M, CFG-free.
# The args follow sd3_pickscore of the official config/nft.py and config/base.py.
# The training steps follow Table 2 of the paper.
# Launch with: EXP=pickscore bash scripts/reproduce/diffusion_nft_train.sh
exp_info: diffusion_nft_pickscore_reproduce  # experiment name

trainer:
  epochs: 2000  # training epochs; 2k steps, as the paper reports
  save_ckpt_every_n_epochs: 200  # save every N epochs, plus the initial weights at epoch 0
