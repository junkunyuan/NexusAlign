# @package _global_
# Reproduce DiffusionNFT on GenEval with SD3.5-M, CFG-free.
# The args follow sd3_geneval of the official config/nft.py and config/base.py.
# The training steps follow Table 2 of the paper.
# Launch with: EXP=geneval bash scripts/reproduce/diffusion_nft_train.sh
exp_info: diffusion_nft_geneval_reproduce  # experiment name

trainer:
  epochs: 1000  # training epochs; 1k steps, as the paper reports

reward:
  # The official GenEval reward scores raw pixels in-process.
  jpeg: false  # send JPEG as Flow-GRPO does; false sends lossless PNG, as DiffusionNFT
