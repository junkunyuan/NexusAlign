# @package _global_
# Train TwinTilt on visual text rendering with SD3.5-M, with CFG only in the base KL.
# The args follow the ocr task of the TwinTilt code, TWINTILT.md and its configs.
# Launch with: EXP=ocr bash scripts/reproduce/twintilt_train.sh
exp_info: twintilt_ocr  # experiment name

algorithm:
  # The TwinTilt trainer takes the group z-scores only of PickScore.
  group_zscore: false  # z-score a single reward in each group; false keeps the raw scores
  # Pull to the base model with CFG 4.5, as in AWM, with a larger weight than the
  # 0.004 of the TwinTilt code. Without it, the general metrics fall below the base.
  kl_weight: 0.01  # coefficient of the velocity KL to the base model
  kl_cfg_scale: 4.5  # CFG scale of the base model in this KL; 1 gives no CFG

trainer:
  epochs: 170  # training epochs; 170 steps, instead of 500 in the TwinTilt code
  save_ckpt_every_n_epochs: 20  # save every N epochs, plus the initial weights at epoch 0
