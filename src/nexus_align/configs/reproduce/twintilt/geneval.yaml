# @package _global_
# Train TwinTilt on GenEval with SD3.5-M, with CFG only in the base KL.
# The args follow the geneval task of the TwinTilt code, TWINTILT.md and its configs.
# Launch with: EXP=geneval bash scripts/reproduce/twintilt_train.sh
exp_info: twintilt_geneval  # experiment name

algorithm:
  # The TwinTilt trainer takes the group z-scores only of PickScore.
  group_zscore: false  # z-score a single reward in each group; false keeps the raw scores
  # Pull to the base model with CFG 4.5, as in AWM, with a larger weight than the
  # 0.004 of the TwinTilt code. Without it, the general metrics are lower.
  kl_weight: 0.01  # coefficient of the velocity KL to the base model
  kl_cfg_scale: 4.5  # CFG scale of the base model in this KL; 1 gives no CFG

trainer:
  epochs: 900  # training epochs; 900 steps, instead of 500 in the TwinTilt code
  save_ckpt_every_n_epochs: 100  # save every N epochs, plus the initial weights at epoch 0

reward:
  # TwinTilt scores lossless PNG images.
  jpeg: false  # send JPEG as Flow-GRPO does; false sends lossless PNG, as DiffusionNFT
  batch_size: 16  # images per request
