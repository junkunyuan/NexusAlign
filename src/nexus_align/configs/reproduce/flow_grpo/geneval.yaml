# @package _global_
# Reproduce Flow-GRPO (with KL) on GenEval with SD3.5-M.
# The args follow geneval_sd3 of the official config/grpo.py and config/base.py.
# Launch with: EXP=geneval bash scripts/reproduce/flow_grpo_train.sh
exp_info: flow_grpo_geneval_reproduce  # experiment name

trainer:
  epochs: 2500  # training epochs; 5000 steps, the length of the paper's learning curve
  save_ckpt_every_n_epochs: 250  # save every N epochs, plus the initial weights at epoch 0
