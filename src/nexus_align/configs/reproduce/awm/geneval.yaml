# @package _global_
# Reproduce AWM on GenEval with SD3.5-M, CFG-free, on 128 GPUs.
# The args follow _geneval_sd3_no_cfg of the official config/dgx_awm.py.
# The training epochs follow the GPU hours of Fig. 1a of the paper.
# Launch with: EXP=geneval bash scripts/reproduce/awm_train.sh
exp_info: awm_geneval_reproduce  # experiment name

trainer:
  # 128 GPUs cannot split the official 72 prompts into whole groups per round.
  groups_per_epoch: 80  # prompts sampled per epoch
  sample_batch_size: 15  # samples per rank in one sampling and training batch
