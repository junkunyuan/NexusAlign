# @package _global_
# Reproduce PixelDiT2-H/16 on 512x512 images with the setting in Tables 3 and 10 of
# the paper.
# The other args follow the official c2i/configs/pixeldit2_h16_in512.yaml and README.
# Launch with: +reproduce=pixeldit2/h16_512
# Evaluate with: CFG_SCALE=2.1 CFG_MIN_T=0.1 CFG_MAX_T=0.925 (official c2i/README.md)
exp_info: pixeldit2_h16_512_reproduce  # experiment name

# Cache the uint8 center crops, and flip them at each load, as the official code does.
data:
  img_size: 512  # image size
  flip_prob: 0.5  # horizontal flip probability
  vae: null  # VAE model path
  cache_dir: ${data_and_model_dir}/ILSVRC/imagenet-1k/pixels_512  # cache directory

model:
  name: pixeldit2_h_16  # pixeldit2_{b,l,h}_16
  input_size: 512  # input size (image size)
  mlp_multiple: 32  # round the SwiGLU width up to a multiple of N; 0 disables it
  single_silu_cond: true  # if true, only adaLN applies SiLU to the condition
  grounding_encoder: ${data_and_model_dir}/timm/vit_base_patch16_dinov3_qkvb.lvd1689m  # frozen DINOv3 path

algorithm:
  noise_scale: 2.0  # noise std; image_size / 256 in paper Table 10
  joint_drop_prob: 0.05  # probability to drop both the label and the grounding tokens

trainer:
  epochs: 680  # training epochs
  train_batch_size: 1024  # total batch size of one optimizer step over all ranks
  learning_rate: 2.0e-4  # Adam learning rate
  warmup_epochs: 5  # linear LR warmup from 0 over N epochs, then constant; 0 disables it
  max_grad_norm: .inf  # max gradient norm for clipping; the official code does not clip
  save_ckpt_every_n_epochs: 50  # save every N epochs; null disables it
  save_ckpt_keep_last_n_epochs: 100  # keep only the last N epoch checkpoints
  log_every_n_steps: 100  # print and track the metrics every N total steps
