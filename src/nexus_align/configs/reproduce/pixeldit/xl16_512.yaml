# @package _global_
# Reproduce PixelDiT-XL on 512x512 images with the setting in Sec. 4.1 of the paper:
# fine-tune the 320-epoch run for 530 epochs.
# The other args follow the official c2i/configs/pix512_xl.yaml and src/diffusion.py.
# Launch with: +reproduce=pixeldit/xl16_512 trainer.resume_path=<last checkpoint of
# xl16_ep320>
# Evaluate with: CFG_SCALE=3.5 CFG_MIN_T=0.1 CFG_MAX_T=1.0 SAMPLE_TIME_SHIFT=2.0
# (official c2i/README.md)
exp_info: pixeldit_xl16_512_reproduce  # experiment name

# Cache the uint8 center crops. The official training does not flip them.
data:
  img_size: 512  # image size
  vae: null  # VAE model path
  cache_dir: ${data_and_model_dir}/ILSVRC/imagenet-1k/pixels_512  # cache directory

model:
  name: pixeldit_xl_16  # pixeldit_{b,l,xl}_16
  input_size: 512  # input size (image size)

algorithm:
  time_shift: 3.0  # shift s of t to t / (t + s (1 - t)); s > 1 adds noise

trainer:
  epochs: 850  # training epochs
  train_batch_size: 256  # total batch size of one optimizer step over all ranks
  learning_rate: 1.0e-5  # Adam learning rate
  adam_beta2: 0.999  # Adam beta2
  max_grad_norm: 0.5  # max gradient norm for clipping
  save_ckpt_every_n_epochs: 50  # save every N epochs; null disables it
  save_ckpt_keep_last_n_epochs: 100  # keep only the last N epoch checkpoints
  log_every_n_steps: 100  # print and track the metrics every N total steps
