name: hpsv3  # reward name
url: http://127.0.0.1:18092  # HPSv3 server on this node; see scripts/tools/reward_server.sh
# HPSv3 is a 7B VLM, so a request of large images needs tens of GB.
batch_size: 4  # images per request
timeout: 120  # seconds per request
max_retries: 10  # retries on server errors before the job fails
