# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
name: imagenet_1k  # dataset name
path: ${data_and_model_dir}/ILSVRC/imagenet-1k  # data path
split: train  # use the training set

# --------------------------------------------------------------------------------
# Processing configs.
# --------------------------------------------------------------------------------
sample_ratio: 1.0  # sampling ratio
img_size: 256  # image size
flip_prob: 0.0  # horizontal flip probability

# --------------------------------------------------------------------------------
# VAE-latent configs.
# To use raw images and not VAE latents, set cache_dir to null.
# Latents are the default, as MeanFlow and iMeanFlow train on them.
# The dataset normalizes each latent as (latent * vae_scale - vae_mean) / vae_std,
# where vae_mean and vae_std are one value or one value per channel.
# --------------------------------------------------------------------------------
vae: ${data_and_model_dir}/stabilityai/sd-vae-ft-mse  # VAE model path
vae_scale: 0.18215  # VAE latent scale
vae_mean: 0.  # VAE latent mean
vae_std: 1.  # VAE latent std
read_batch: 256  # batch size to read the parquet files
vae_batch: 256  # batch size for VAE encoding
shard_size: 8192  # number of items in each cache shard
preprocess_workers: 8  # number of workers to preprocess the data
cache_dir: ${data_and_model_dir}/ILSVRC/imagenet-1k/latents  # latent cache directory
shared_cache: false  # if false, multi-node runs use one cache subdirectory per node
