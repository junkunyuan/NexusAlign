name: reward  # evaluator name
# Select each reward to score with as +reward@rewards.<name>=<name>.

# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
global_seed: 0  # base seed; runtime RNG uses {global_seed + rank}
num_steps: 40  # number of sampling steps
guidance_scale: 4.5  # classifier-free guidance scale; 1.0 means no CFG
model_key: ema  # weights to sample with and to load from each checkpoint: "model" or "ema"
per_proc_batch_size: 16  # sampling batch size per GPU
num_workers: 4  # threads per rank to write and read the PNG files of the images
ckpts: null  # checkpoint paths to evaluate; null uses all in ${log_dir}/checkpoints
dry_run: false  # if True, print the plan without sampling
new_run: false  # if True, evaluate in a new directory, not in the latest one

# --------------------------------------------------------------------------------
# Data paths.
# --------------------------------------------------------------------------------
data: ${data}  # prompt dataset; the data config defines it
split: test  # evaluate on the test prompts
