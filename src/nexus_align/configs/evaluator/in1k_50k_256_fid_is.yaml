name: in1k_50k_256_fid_is  # evaluator name

# --------------------------------------------------------------------------------
# General configs.
# --------------------------------------------------------------------------------
global_seed: 0  # base seed; runtime RNG uses {global_seed + rank}
resolution: 256  # generated image resolution
cfg_scale: 1.0  # classifier-free guidance scale; 1.0 means no CFG
cfg_min_t: 0.0  # start of the guidance interval; only some algorithms condition on it
cfg_max_t: 1.0  # end of the guidance interval; only some algorithms condition on it
num_steps: 1  # number of sampling steps
balanced_labels: false  # if True, sample each class equally, else sample random labels
model_key: ema  # weights to sample with and to load from each checkpoint: "model" or "ema"
num_fid_samples: 50000  # number of images to generate per checkpoint
per_proc_batch_size: 128  # sampling batch size per GPU
save_images: false  # if True, save generated images as PNG files; if False, score them in memory
num_workers: 4  # threads per rank to write and read the PNG files
compile: true  # if True, compile the sampling model and the VAE decoder
ckpts: null  # checkpoint paths to evaluate; null uses all in ${log_dir}/checkpoints
dry_run: false  # if True, print the plan without sampling
new_run: false  # if True, evaluate in a new directory, not in the latest one

# --------------------------------------------------------------------------------
# Data and model paths.
# --------------------------------------------------------------------------------
vae_path: ${data.vae}  # VAE model path from the data config; null for pixel models
vae_scale: ${data.vae_scale}  # VAE latent scale; the data config defines it
vae_mean: ${data.vae_mean}  # VAE latent mean; the data config defines it
vae_std: ${data.vae_std}  # VAE latent std; the data config defines it
fid_stats: ${data_and_model_dir}/fid_stats/imf_jax_in256_stats.npz  # reference FID statistics
inception_weights: ${data_and_model_dir}/torch_fidelity/weights-inception-2015-12-05-6726825d.pth  # Inception-v3 weights for FID and IS
